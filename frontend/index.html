<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 | BizTalk AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Ambient Background Lighting -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-2xl space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wider uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                AI BizTalk Converter
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 tracking-tight">
                💼 업무 말투 변환기
            </h1>
            <p class="text-sm sm:text-base text-slate-400 max-w-lg mx-auto leading-relaxed">
                전달하고 싶은 메시지를 편하게 입력하시면 상황에 맞는 정중하고 스마트한 비즈니스 언어로 바꿔드립니다.
            </p>
        </header>

        <!-- Main Card -->
        <main class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-indigo-950/50 space-y-6">
            
            <!-- Step 1: Target Audience Selection -->
            <div class="space-y-3">
                <label class="flex items-center gap-2 text-sm font-semibold text-slate-200">
                    <span class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-600 text-white text-xs font-bold">1</span>
                    수신 대상 선택
                </label>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="targetGrid">
                    <button type="button" class="target-btn group text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/50 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-200 cursor-pointer active ring-2 ring-indigo-500 bg-indigo-500/10 border-indigo-500/50" data-target="boss">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xl">👔</span>
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 group-hover:bg-slate-700">상사 / 임원</span>
                        </div>
                        <p class="text-xs text-slate-400 group-hover:text-slate-300">격식 있고 공손한 경어체</p>
                    </button>

                    <button type="button" class="target-btn group text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/50 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-200 cursor-pointer" data-target="colleague">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xl">🤝</span>
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 group-hover:bg-slate-700">타팀 동료</span>
                        </div>
                        <p class="text-xs text-slate-400 group-hover:text-slate-300">정중하고 협조적인 업무 어조</p>
                    </button>

                    <button type="button" class="target-btn group text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/50 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-200 cursor-pointer" data-target="client">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xl">🌐</span>
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 group-hover:bg-slate-700">고객 / 외부</span>
                        </div>
                        <p class="text-xs text-slate-400 group-hover:text-slate-300">친절하고 신뢰감 있는 서비스 어조</p>
                    </button>

                    <button type="button" class="target-btn group text-left p-4 rounded-2xl border border-slate-800 bg-slate-950/50 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-200 cursor-pointer" data-target="team">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xl">👥</span>
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 group-hover:bg-slate-700">팀 내 동료</span>
                        </div>
                        <p class="text-xs text-slate-400 group-hover:text-slate-300">간결하고 실무적인 어조</p>
                    </button>
                </div>
            </div>

            <!-- Step 2: Input Textarea -->
            <div class="space-y-3">
                <label for="inputText" class="flex items-center gap-2 text-sm font-semibold text-slate-200">
                    <span class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-600 text-white text-xs font-bold">2</span>
                    원문 내용 입력
                </label>
                <div class="relative">
                    <textarea 
                        id="inputText" 
                        placeholder="예: 내일까지 보고서 제출 어려울 것 같음. 데이터 분석 시간이 더 필요해서 다음 주 월요일까지 제출해도 될까요?" 
                        rows="4" 
                        maxlength="1000"
                        class="w-full bg-slate-950/70 border border-slate-800 rounded-2xl p-4 pb-8 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all duration-200 resize-y"
                    ></textarea>
                    <div class="absolute bottom-3 right-4 text-xs text-slate-500 pointer-events-none">
                        <span id="charCount">0</span>/1000자
                    </div>
                </div>
            </div>

            <!-- Convert Button -->
            <div>
                <button 
                    type="button" 
                    id="convertBtn" 
                    class="w-full py-4 px-6 rounded-2xl font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    <span id="btnText">🪄 비즈니스 말투로 변환하기</span>
                    <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </button>
            </div>

            <!-- Output Section -->
            <div class="space-y-3 pt-2 border-t border-slate-800/80">
                <div class="flex items-center justify-between">
                    <label for="outputText" class="flex items-center gap-2 text-sm font-semibold text-slate-200">
                        <span class="flex items-center justify-center w-5 h-5 rounded-full bg-indigo-600 text-white text-xs font-bold">3</span>
                        변환 결과
                    </label>
                    <button 
                        type="button" 
                        id="copyBtn" 
                        disabled 
                        class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200 flex items-center gap-1.5 cursor-pointer"
                    >
                        <span id="copyBtnText">📋 복사하기</span>
                    </button>
                </div>

                <div class="relative">
                    <textarea 
                        id="outputText" 
                        placeholder="변환 버튼을 누르면 이 곳에 상황에 맞는 적절한 비즈니스 메시지가 출력됩니다." 
                        rows="6" 
                        readonly
                        class="w-full bg-slate-950/90 border border-slate-800 rounded-2xl p-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none resize-y cursor-default leading-relaxed"
                    ></textarea>

                    <!-- Loading Overlay inside Output -->
                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-4 text-center space-y-3 z-10">
                        <div class="w-10 h-10 border-3 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
                        <p class="text-xs text-slate-300 font-medium animate-pulse">
                            Solar-Pro AI가 정중한 비즈니스 문장으로 다듬고 있습니다...
                        </p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-500">
            © 2026 BizTalk Antigravity · Powered by Upstage Solar-Pro & TailwindCSS
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-indigo-500/40 text-slate-100 px-5 py-2.5 rounded-full text-xs font-medium shadow-2xl z-50 transition-all duration-300">
    </div>

    <script src="js/app.js"></script>
</body>
</html>
